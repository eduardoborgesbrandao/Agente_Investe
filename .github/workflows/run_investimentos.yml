name: Executar Agente de Investimentos

on:
  schedule:
    - cron: '30 8 * * *' # Roda todos os dias às 05:30 (Horário de Brasília)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests yfinance feedparser google-genai python-dotenv beautifulsoup4

      - name: Preparar arquivos ocultos
        env:
          CARTEIRA_JSON: ${{ secrets.CARTEIRA_JSON }}
          PROMPT_TXT: ${{ secrets.PROMPT_TXT }}
        run: |
          echo "$CARTEIRA_JSON" > carteira.json
          echo "$PROMPT_TXT" > prompt.txt

      - name: Executar agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_EMAIL:     ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD:  ${{ secrets.SMTP_PASSWORD }}
          DEST_EMAIL:     ${{ secrets.DEST_EMAIL }}
        run: python agente_investimentos.py
